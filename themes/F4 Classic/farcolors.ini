[style]
Name = Custom
Base = Classic

[farcolors]

# Panel
Panel.Box = foreground:#00FFFF | background:#000080
Panel.Cursor = foreground:#000000 | background:#008080
Panel.Cursor.Inactive = foreground:#D3D7CF | background:#555753
Panel.Cursor.Inactive.Selected = foreground:#FDFF00 | background:#555753
Panel.Cursor.Selected = foreground:#FDFF00 | background:#008080
Panel.Dir = foreground:#FFFFFF | background:#000080
Panel.FastFindNoMatch = foreground:#D55F5F | background:#000080
Panel.Info.Selected = foreground:#FFFF00 | background:#000080
Panel.Info.Total = foreground:#00FFFF | background:#000080
Panel.Scrollbar = foreground:#00FFFF | background:#000080
Panel.Scrollbar.Minimal = foreground:#FFFFFF | background:#000080
Panel.Tabs = foreground:#00FFFF | background:#000080
Panel.Tabs.Accent = foreground:#FFFF00 | background:#000080
Panel.Tabs.Active = foreground:#FFFFFF | background:#000080
Panel.Tabs.Attention = foreground:#FD8700 | background:#000080
Panel.Text = foreground:#00FFFF | background:#000080
Panel.Text.Highlight = foreground:#FFFF00 | background:#000080
Panel.Text.Info = foreground:#00FFFF | background:#000080
Panel.Text.Selected = foreground:#FFFF00 | background:#000080
Panel.Title = foreground:#00FFFF | background:#000080
Panel.Title.Column = foreground:#FFFF00 | background:#000080
Panel.Title.Selected = foreground:#00FFFF | background:#3030c0

# Lists and tables
# Table.Separator colors the column separators of a table, not the outer frame.
# Table.Scrollbar is the scrollbar of generic lists and tables; menus, panels,
# the viewer, the editor, help and combo dropdowns have scrollbar keys of their own.
Table.Scrollbar = foreground:#C0C0C0 | background:#000080
Table.Separator = foreground:#C0C0C0 | background:#000080

# Dialog
Dialog.Box = foreground:#000000 | background:#C0C0C0
Dialog.Box.Title = foreground:#000000 | background:#C0C0C0
Dialog.Box.Title.Highlight = foreground:#FEFF00 | background:#C0C0C0
Dialog.Button = foreground:#000000 | background:#C0C0C0
Dialog.Button.Highlight = foreground:#FEFF00 | background:#C0C0C0
Dialog.Button.Highlight.Selected = foreground:#FEFF00 | background:#008080
Dialog.Button.Selected = foreground:#000000 | background:#008080
Dialog.Combo.Box = foreground:#FFFFFF | background:#008080
Dialog.Combo.Highlight = foreground:#FEFF00 | background:#008080
Dialog.Combo.Highlight.Selected = foreground:#FFFF00 | background:#000000
Dialog.Combo.Scrollbar = foreground:#FFFFFF | background:#00A0A0
Dialog.Combo.Text = foreground:#FFFFFF | background:#008080
Dialog.Combo.Text.Selected = foreground:#FFFFFF | background:#000000
Dialog.Combo.Title = foreground:#FFFFFF | background:#008080
Dialog.Edit = foreground:#000000 | background:#008080
Dialog.Edit.Selected = foreground:#000000 | background:#D3D7CF
Dialog.Edit.Unchanged = foreground:#5E5E5E | background:#008080
Dialog.Indicator.Background = inherit
Dialog.Settings.Background = inherit
Dialog.Text = foreground:#000000 | background:#C0C0C0
Dialog.Text.Highlight = foreground:#FEFF00 | background:#C0C0C0

# Warning message
WarnDialog.Box = foreground:#FFFFFF | background:#800000
WarnDialog.Box.Title = foreground:#FFFFFF | background:#800000
WarnDialog.Box.Title.Highlight = foreground:#FFFF00 | background:#800000
WarnDialog.Button = foreground:#FFFFFF | background:#800000
WarnDialog.Button.Highlight = foreground:#FFFF00 | background:#800000
WarnDialog.Button.Highlight.Selected = foreground:#FEFF00 | background:#008080
WarnDialog.Button.Selected = foreground:#000000 | background:#008080
WarnDialog.Edit = foreground:#000000 | background:#008080
WarnDialog.Edit.Selected = foreground:#000000 | background:#008080
WarnDialog.Edit.Unchanged = foreground:#000000 | background:#008080
WarnDialog.Text = foreground:#FFFFFF | background:#800000
WarnDialog.Text.Highlight = foreground:#FFFF00 | background:#800000

# Menu
Menu.Box = foreground:#FFFFFF | background:#008080
Menu.Highlight = foreground:#FEFF00 | background:#008080
Menu.Highlight.Selected = foreground:#FFFF00 | background:#000000
Menu.Scrollbar = foreground:#FFFFFF | background:#00A0A0
Menu.Text = foreground:#FFFFFF | background:#008080
Menu.Text.Selected = foreground:#FFFFFF | background:#000000
Menu.Title = foreground:#FFFFFF | background:#008080

# Horizontal menu
HMenu.Highlight = foreground:#FEFF00 | background:#C0C0C0
HMenu.Highlight.Selected = foreground:#FEFF00 | background:#00ff00
HMenu.Text = foreground:#000000 | background:#C0C0C0
HMenu.Text.Selected = foreground:#000000 | background:#00ff00

# Key bar
Keybar.Num = foreground:#D3D7CF | background:#000000
Keybar.Text = foreground:#000000 | background:#008080

# Command line
CommandLine = foreground:#FFFFFF | background:#000000
CommandLine.Prefix = foreground:#C0C0C0 | background:#000000
CommandLine.Prompt.Inactive = foreground:#555753 | background:#000000
CommandLine.Selected = foreground:#000000 | background:#FFFF00
CommandLine.UserScreen = foreground:#D3D7CF | background:#000000
CommandLine.User = foreground:#8ae234 | background:#000000
CommandLine.Path = foreground:#C0C0C0 | background:#000000

# Viewer
Viewer.Arrows = foreground:#FFFF00 | background:#000080
Viewer.Scrollbar = foreground:#808080 | background:#000080
Viewer.Status = foreground:#000000 | background:#008080
Viewer.Text = foreground:#00FFFF | background:#000080
Viewer.Text.Selected = foreground:#000000 | background:#008080

# Editor
Editor.Occurrence = foreground:#2E3436 | background:#c4a000
Editor.Scrollbar = foreground:#808080 | background:#000080
Editor.Status = foreground:#000000 | background:#008080
Editor.Syntax.Comment = foreground:#555753 | background:#000000
Editor.Syntax.Function = foreground:#FCE94F | background:#000000
Editor.Syntax.Heading = foreground:#729FCF | background:#000000
Editor.Syntax.Keyword = foreground:#729FCF | background:#000000
Editor.Syntax.Number = foreground:#AD7FA8 | background:#000000
Editor.Syntax.Operator = foreground:#FFFFFF | background:#000000
Editor.Syntax.String = foreground:#8AE234 | background:#000000
Editor.Syntax.Variable = foreground:#EEEEEC | background:#000000
Editor.Text = foreground:#C0C0C0 | background:#000080
Editor.WrapMark = foreground:#00FFFF | background:#000000
Editor.Text.Selected = foreground:#2e3436 | background:#d3d7cf

# Help           
Help.Box = foreground:#000000 | background:#008080
Help.Box.Title = foreground:#000000 | background:#008080
Help.Scrollbar = foreground:#000000 | background:#008080
Help.Text = foreground:#FFFFFF | background:#008080
Help.Text.Highlight = foreground:#8F8F8F | background:#008080
Help.Topic = foreground:#FFFF00 | background:#008080
Help.Topic.Selected = foreground:#FFFFFF | background:#0000A0

# Terminal
Terminal.Cursor = foreground:#FFFFFF | background:#000000
