# [DERIVED]
WarnDialog.OverflowArrow=foreground:#FF6C60 | background:#231111

WarnDialog.Text=foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Text.Highlight=foreground:#FCE94F | background:#3B1C1C