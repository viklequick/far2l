[style]
Base=Modern
Name=Custom

[farcolors]

# ============================================================================
# Палитра f4, на основе которой подобраны недостающие цвета для far2l:
#   фон панелей/редактора/полей ввода  #232323
#   фон диалогов/меню                  #434343
#   фон горизонтального меню/настроек  #343434
#   выделение (курсор)                 #3B6290
#   текст                              #D0D0D0   белый #FFFFFF
#   акцент/горячие клавиши             #7FAFE3   на выделении #D8E9FF
#   рамки/скроллбары                   #5A5A5A
#   отмеченные файлы                   #F1EC0E
#   отключённое (ВЫВЕДЕНО)             #6A6A6A
# Строки, помеченные "# [DERIVED]" — в f4 такого ключа нет, цвет подобран.
# ============================================================================

# ---- Command line ----------------------------------------------------------
CommandLine=foreground:#D0D0D0 | background:#000000
CommandLine.Path=foreground:#9CDC6A | background:#000000
CommandLine.Prefix=foreground:#9CDC6A | background:#000000
CommandLine.Prompt.Inactive=foreground:#555753 | background:#000000
CommandLine.Selected=foreground:#FFFFFF | background:#3B6290
CommandLine.User=foreground:#8ae234 | background:#000000
CommandLine.UserScreen=foreground:#D0D0D0 | background:#000000

# ---- Clock -----------------------------------------------------------------
# [DERIVED] как HMenu.Text (часы находятся в строке меню)
Clock=foreground:#D0D0D0 | background:#343434

# ---- Dialog ----------------------------------------------------------------
Dialog.Box=foreground:#5A5A5A | background:#434343
Dialog.Box.Title=foreground:#E8E8E8 | background:#434343
Dialog.Box.Title.Highlight=foreground:#7FAFE3 | background:#434343
Dialog.Button=foreground:#D0D0D0 | background:#434343
Dialog.Button.Highlight=foreground:#7FAFE3 | background:#434343
Dialog.Button.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.Button.Selected=foreground:#FFFFFF | background:#3B6290

# [DERIVED] Dialog.Combo* — как Dialog.Combo.Text/Box из f4 (фон #232323)
Dialog.Combo=foreground:#D0D0D0 | background:#232323
Dialog.Combo.Arrows=foreground:#7FAFE3 | background:#232323
Dialog.Combo.Arrows.Disabled=foreground:#6A6A6A | background:#232323
Dialog.Combo.Arrows.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.Combo.Box=foreground:#5A5A5A | background:#232323
Dialog.Combo.Disabled=foreground:#6A6A6A | background:#232323
Dialog.Combo.GrayText=foreground:#9A9A9A | background:#232323
Dialog.Combo.GrayText.Selected=foreground:#D0D0D0 | background:#3B6290
Dialog.Combo.Highlight=foreground:#7FAFE3 | background:#232323
Dialog.Combo.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.Combo.Scrollbar=foreground:#5A5A5A | background:#232323
Dialog.Combo.Selected=foreground:#AAAAAA | background:#3B6290
Dialog.Combo.Text=foreground:#D0D0D0 | background:#232323
Dialog.Combo.Text.Selected=foreground:#FFFFFF | background:#3B6290
Dialog.Combo.Title=foreground:#D0D0D0 | background:#232323

# [DERIVED] кнопка по умолчанию: как обычная, но текст ярче (белый)
Dialog.DefaultButton=foreground:#FFFFFF | background:#434343
Dialog.DefaultButton.Highlight=foreground:#7FAFE3 | background:#434343
Dialog.DefaultButton.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.DefaultButton.Selected=foreground:#FFFFFF | background:#3B6290

# [DERIVED] отключённые элементы
Dialog.Disabled=foreground:#6A6A6A | background:#434343

Dialog.Edit=foreground:#D0D0D0 | background:#232323
# [DERIVED]
Dialog.Edit.Disabled=foreground:#6A6A6A | background:#232323
Dialog.Edit.Selected=foreground:#FFFFFF | background:#3B6290
Dialog.Edit.Unchanged=foreground:#9A9A9A | background:#232323
Dialog.Indicator.Background=background:#232323

# [DERIVED] Dialog.List* — списки внутри диалогов; оформлены как Menu из f4 (фон #434343)
Dialog.List=foreground:#D0D0D0 | background:#434343
Dialog.List.Arrows=foreground:#7FAFE3 | background:#434343
Dialog.List.Arrows.Disabled=foreground:#6A6A6A | background:#434343
Dialog.List.Arrows.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.List.Box=foreground:#5A5A5A | background:#434343
Dialog.List.Disabled=foreground:#6A6A6A | background:#434343
Dialog.List.GrayText=foreground:#9A9A9A | background:#434343
Dialog.List.GrayText.Selected=foreground:#D0D0D0 | background:#3B6290
Dialog.List.Highlight=foreground:#7FAFE3 | background:#434343
Dialog.List.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
Dialog.List.Scrollbar=foreground:#5A5A5A | background:#434343
Dialog.List.Selected=foreground:#D0D0D0 | background:#3B6290
Dialog.List.Text=foreground:#D0D0D0 | background:#434343
Dialog.List.Text.Selected=foreground:#FFFFFF | background:#3B6290
Dialog.List.Title=foreground:#D0D0D0 | background:#434343

# [DERIVED] стрелка переполнения поля ввода (фон как у Dialog.Edit)
Dialog.OverflowArrow=foreground:#7FAFE3 | background:#232323

Dialog.Settings.Background=background:#343434
Dialog.Text=foreground:#D0D0D0 | background:#434343
Dialog.Text.Highlight=foreground:#7FAFE3 | background:#434343

# ---- Editor ----------------------------------------------------------------
# [DERIVED] как Editor.Status
Editor.Clock=foreground:#D0D0D0 | background:#434343
# [DERIVED] номера строк — приглушённый серый (как комментарии) на фоне редактора
Editor.LineNumber=foreground:#6A6A6A | background:#232323
Editor.Occurrence=foreground:#232323 | background:#C678DD
Editor.Scrollbar=foreground:#5A5A5A | background:#232323
Editor.Status=foreground:#D0D0D0 | background:#434343
Editor.Syntax.Comment=foreground:#6A6A6A | background:#232323
Editor.Syntax.Function=foreground:#E5C07B | background:#232323
Editor.Syntax.Heading=foreground:#61AFEF | background:#232323
Editor.Syntax.Keyword=foreground:#61AFEF | background:#232323
Editor.Syntax.Number=foreground:#D19A66 | background:#232323
Editor.Syntax.Operator=foreground:#D0D0D0 | background:#232323
Editor.Syntax.String=foreground:#98C379 | background:#232323
Editor.Syntax.Variable=foreground:#D0D0D0 | background:#232323
Editor.Text=foreground:#D0D0D0 | background:#232323
Editor.Text.Selected=foreground:#FFFFFF | background:#3B6290
Editor.WrapMark=foreground:#7FAFE3 | background:#232323

# ---- Horizontal menu -------------------------------------------------------
HMenu.Highlight=foreground:#7FAFE3 | background:#343434
HMenu.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
HMenu.Text=foreground:#D0D0D0 | background:#343434
HMenu.Text.Selected=foreground:#FFFFFF | background:#3B6290

# ---- Help ------------------------------------------------------------------
Help.Box=foreground:#5A5A5A | background:#2A2A2C
Help.Box.Title=foreground:#5A5A5A | background:#2A2A2C
Help.Scrollbar=foreground:#5A5A5A | background:#2A2A2C
Help.Text=foreground:#D0D0D0 | background:#2A2A2C
Help.Text.Highlight=foreground:#FFFFFF | background:#2A2A2C
Help.Topic=foreground:#6CA6CD | background:#2A2A2C
Help.Topic.Selected=foreground:#FFFFFF | background:#3B6290

# ---- Key bar ---------------------------------------------------------------
# [DERIVED] фон строки клавиш — как у номеров клавиш в f4
Keybar.Background=foreground:#8A8A8A | background:#000000
Keybar.Num=foreground:#8A8A8A | background:#000000
Keybar.Text=foreground:#C8C8C8 | background:#363636

# ---- Menu ------------------------------------------------------------------
# [DERIVED] стрелки, серый текст, префиксы — на основе Menu.* из f4
Menu.Arrows=foreground:#7FAFE3 | background:#434343
Menu.Arrows.Disabled=foreground:#6A6A6A | background:#434343
Menu.Arrows.Selected=foreground:#D8E9FF | background:#3B6290
Menu.Box=foreground:#5A5A5A | background:#434343
Menu.GrayText=foreground:#9A9A9A | background:#434343
Menu.GrayText.Selected=foreground:#D0D0D0 | background:#3B6290
Menu.Highlight=foreground:#7FAFE3 | background:#434343
Menu.Highlight.Selected=foreground:#D8E9FF | background:#3B6290
Menu.Prefix=foreground:#9A9A9A | background:#434343
Menu.Prefix.Selected=foreground:#B8B8B8 | background:#3B6290
Menu.Scrollbar=foreground:#5A5A5A | background:#434343
Menu.Text=foreground:#D0D0D0 | background:#434343
Menu.Text.Disabled=foreground:#6A6A6A | background:#434343
Menu.Text.Selected=foreground:#FFFFFF | background:#3B6290
Menu.Title=foreground:#D0D0D0 | background:#434343

# Не используется far2l — оставлено как есть
Not.Used=background:#000000 foreground:#646464, B_BLACK | F_BLACK; back_rgb(0, 0, 0) | fore_rgb(100, 100, 100)

# ---- Panel -----------------------------------------------------------------
Panel.Box=foreground:#444444 | background:#232323
Panel.Cursor=foreground:#AAAAAA | background:#3B6290
Panel.Cursor.Inactive=foreground:#D0D0D0 | background:#555753
Panel.Cursor.Inactive.Selected=foreground:#F1EC0E | background:#555753
Panel.Cursor.Selected=foreground:#F1EC0E | background:#3B6290
Panel.Dir=foreground:#FFFFFF | background:#232323
# [DERIVED] текст при перетаскивании — как Panel.Cursor.Selected
Panel.DragText=foreground:#F1EC0E | background:#3B6290
Panel.FastFindNoMatch=foreground:#C45B5B | background:#232323
Panel.Info.Selected=foreground:#F1EC0E | background:#3B6290
Panel.Info.Total=foreground:#D0D0D0 | background:#232323
# [DERIVED] номер экрана — акцентный цвет на фоне строки табов
Panel.ScreensNumber=foreground:#7FAFE3 | background:#000000
Panel.Scrollbar=foreground:#5A5A5A | background:#232323
Panel.Scrollbar.Minimal=foreground:#A0A0A0 | background:#232323
Panel.Tabs=foreground:#AAAAAA | background:#000000
Panel.Tabs.Accent=foreground:#7FAFE3
Panel.Tabs.Active=foreground:#FFFFFF | background:#232323
Panel.Tabs.Attention=foreground:#FF9F43
Panel.Text=foreground:#AAAAAA | background:#232323
Panel.Text.Highlight=foreground:#C678DD | background:#232323
Panel.Text.Info=foreground:#B8B8B8 | background:#232323
Panel.Text.Selected=foreground:#F1EC0E | background:#232323
Panel.Title=foreground:#D0D0D0 | background:#232323
Panel.Title.Column=foreground:#C8C8C8 | background:#232323
Panel.Title.Selected=foreground:#FFFFFF | background:#434343

# ---- Tables ----------------------------------------------------------------
Table.Scrollbar=foreground:#5A5A5A | background:#232323
Table.Separator=foreground:#5A5A5A | background:#232323

# ---- Terminal --------------------------------------------------------------
Terminal.Cursor=foreground:#FFFFFF

# ---- Viewer ----------------------------------------------------------------
Viewer.Arrows=foreground:#A8A8A8 | background:#232323
# [DERIVED] как Viewer.Status
Viewer.Clock=foreground:#D0D0D0 | background:#434343
Viewer.Scrollbar=foreground:#5A5A5A | background:#232323
Viewer.Status=foreground:#D0D0D0 | background:#434343
Viewer.Text=foreground:#D0D0D0 | background:#232323
Viewer.Text.Selected=foreground:#FFFFFF | background:#3B6290

# ---- Warning dialog --------------------------------------------------------
WarnDialog.Box=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.Box.Title=foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Box.Title.Highlight=foreground:#FF6C60 | background:#3B1C1C
WarnDialog.Button=foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Button.Highlight=foreground:#FF6C60 | background:#3B1C1C
WarnDialog.Button.Highlight.Selected=foreground:#FF6C60 | background:#5E2727
WarnDialog.Button.Selected=foreground:#FFFFFF | background:#5E2727

# [DERIVED] WarnDialog.Combo* — красная гамма по образцу WarnDialog.Edit (фон #231111)
WarnDialog.Combo=foreground:#FFA1A1 | background:#231111
WarnDialog.Combo.Arrows=foreground:#FF6C60 | background:#231111
WarnDialog.Combo.Arrows.Disabled=foreground:#8A5A5A | background:#231111
WarnDialog.Combo.Arrows.Selected=foreground:#FFFFFF | background:#5E2727
WarnDialog.Combo.Box=foreground:#8A5A5A | background:#231111
WarnDialog.Combo.Disabled=foreground:#8A5A5A | background:#231111
WarnDialog.Combo.GrayText=foreground:#8A5A5A | background:#231111
WarnDialog.Combo.GrayText.Selected=foreground:#FFA1A1 | background:#5E2727
WarnDialog.Combo.Highlight=foreground:#FF6C60 | background:#231111
WarnDialog.Combo.Highlight.Selected=foreground:#FF6C60 | background:#5E2727
WarnDialog.Combo.Scrollbar=foreground:#8A5A5A | background:#231111
WarnDialog.Combo.Selected=foreground:#FFA1A1 | background:#5E2727
WarnDialog.Combo.Text=foreground:#FFA1A1 | background:#231111
WarnDialog.Combo.Text.Selected=foreground:#FFFFFF | background:#5E2727
WarnDialog.Combo.Title=foreground:#FFA1A1 | background:#231111

# [DERIVED] кнопка по умолчанию — как обычная, но текст белый
WarnDialog.DefaultButton=foreground:#FFFFFF | background:#3B1C1C
WarnDialog.DefaultButton.Highlight=foreground:#FF6C60 | background:#3B1C1C
WarnDialog.DefaultButton.Highlight.Selected=foreground:#FF6C60 | background:#5E2727
WarnDialog.DefaultButton.Selected=foreground:#FFFFFF | background:#5E2727

# [DERIVED]
WarnDialog.Disabled=foreground:#8A5A5A | background:#3B1C1C

WarnDialog.Edit=foreground:#FFA1A1 | background:#231111
# [DERIVED]
WarnDialog.Edit.Disabled=foreground:#6A4444 | background:#231111
WarnDialog.Edit.Selected=foreground:#FFFFFF | background:#5E2727
WarnDialog.Edit.Unchanged=foreground:#8A5A5A | background:#231111

# [DERIVED] WarnDialog.List* — красная версия Dialog.List (фон #3B1C1C)
WarnDialog.List=foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.List.Arrows=foreground:#FF6C60 | background:#3B1C1C
WarnDialog.List.Arrows.Disabled=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.List.Arrows.Selected=foreground:#FFFFFF | background:#5E2727
WarnDialog.List.Box=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.List.Disabled=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.List.GrayText=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.List.GrayText.Selected=foreground:#FFA1A1 | background:#5E2727
WarnDialog.List.Highlight=foreground:#FF6C60 | background:#3B1C1C
WarnDialog.List.Highlight.Selected=foreground:#FF6C60 | background:#5E2727
WarnDialog.List.Scrollbar=foreground:#8A5A5A | background:#3B1C1C
WarnDialog.List.Selected=foreground:#FFA1A1 | background:#5E2727
WarnDialog.List.Text=foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.List.Text.Selected=foreground:#FFFFFF | background:#5E2727
